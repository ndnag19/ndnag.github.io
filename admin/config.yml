backend:
  name: turbo-github
  turbo_site_id: 08b03626-6ec1-4dae-98e0-ec4bcd756870
  branch: main

site_url: https://ndnag.com
display_url: https://ndnag.com
locale: en
media_folder: assets/images/uploads
public_folder: /assets/images/uploads

collections:
  - name: articles
    label: Articles
    label_singular: Article
    folder: _posts
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Publish date, name: date, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { label: Short introduction, name: excerpt, widget: text }
      - { label: Cover image, name: image, widget: image, required: false }
      - label: Contributors
        name: contributors
        widget: list
        required: false
        hint: "You are credited by default. Add collaborators here when an article has contributors."
        summary: "{{fields.name}}"
        fields:
          - { label: Name, name: name, widget: string }
          - { label: Profile link, name: url, widget: string, required: false }
      - { label: Layout, name: layout, widget: hidden, default: article }
      - { label: Published, name: published, widget: hidden, default: true }
      - { label: Article, name: body, widget: markdown }

  - name: projects
    label: Projects & Products
    label_singular: Project or product
    folder: _projects
    create: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { label: Name, name: title, widget: string }
      - { label: Category, name: category, widget: string, hint: "For example, PowerPoint add-in or Excel tool." }
      - { label: Short description, name: excerpt, widget: text }
      - { label: Details, name: body, widget: markdown, required: false }
      - { label: Project or product link, name: external_url, widget: string }
      - { label: Link label, name: link_label, widget: string, default: "Explore project" }
      - { label: Display order, name: order, widget: number, value_type: int, min: 1, default: 10, hint: "Lower numbers appear first on both the homepage and Work & Projects page." }
      - { label: Card illustration, name: card_image, widget: image, required: false, hint: "Upload a graphic or choose one from the media library. Leave empty to use the simple built-in illustration." }
      - { label: Card background color, name: card_background, widget: color, allowInput: true, default: "#e9ede4", hint: "Choose a color or enter a hex code." }
      - { label: Card accent color, name: card_accent, widget: color, allowInput: true, default: "#435343", hint: "Used for the category and link. Choose a color or enter a hex code." }
      - { label: Built-in illustration, name: symbol, widget: hidden, default: scenario }
      - { label: Original card palette, name: tone, widget: hidden, default: green }

  - name: selected_work
    label: Selected Work
    label_singular: Case study
    folder: _selected_work
    create: true
    delete: true
    extension: md
    format: frontmatter
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Context, name: context, widget: string, required: false, hint: "For example, Commercial strategy · Biopharma" }
      - { label: Short introduction, name: summary, widget: text, required: false }
      - { label: The question, name: question, widget: markdown, required: false }
      - { label: The challenge, name: challenge, widget: markdown, required: false }
      - { label: Approach, name: approach, widget: markdown, required: false }
      - { label: What I delivered, name: solution, widget: markdown, required: false }
      - { label: Impact, name: impact, widget: markdown, required: false }
      - { label: Display order, name: order, widget: number, value_type: int, min: 1, default: 10, hint: "Lower numbers appear first on the Work & Projects page." }
