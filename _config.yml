title: "Dheerajnag Nelanutala"

description: "Helping organizations make better decisions under uncertainty."

url: "https://ndnag.com"
baseurl: ""
permalink: /articles/:title/

include:
  - _pages

remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "default"

collections:
  projects:
    output: false

defaults:
  - scope:
      path: "_posts"
      type: "posts"
    values:
      published: true
      classes:
        - article-page

sass:
  style: compressed

plugins:
  - jekyll-include-cache

author:
  name: "Dheerajnag Nelanutala"
  excerpt: "Helping organizations make better decisions under uncertainty."
